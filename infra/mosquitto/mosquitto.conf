# ==========================================================================
# Mosquitto Configuration — OmniView IQ POC
# ==========================================================================
# POC-only: anonymous access enabled, no TLS.
# Production deployments MUST add authentication + TLS.
# ==========================================================================

# ── Listener ─────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

listener 9001
protocol websockets

# ── Security (POC only — anonymous allowed) ──────────────────────────────
allow_anonymous true

# ── Persistence ──────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type all
