[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniview-iq"
version = "0.1.0"
description = "OmniView IQ — Edge-to-cloud IIoT monitoring POC"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<3.0",
    "streamlit>=1.30,<2.0",
    "jsonschema>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
